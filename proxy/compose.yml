# ==============================================================================
# Zabbix Proxy - Sede Cliente (MSP)
# Stack: Zabbix Proxy (SQLite) + SNMP traps + Zabbix Agent2 per automonitoring
# ==============================================================================
# Modalita' ACTIVE: il proxy inizia lui la connessione verso il server centrale.
# Richiede SOLO connettivita' OUTBOUND dalla sede cliente verso il server
# centrale sulla porta 10051/TCP. Nessuna porta in ingresso da Internet.
#
# La versione DEVE corrispondere a quella del server centrale (ZABBIX_VERSION).
# ==============================================================================

name: zabbix-proxy

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ----------------------------------------------------------------------------
  # Zabbix Proxy (SQLite)
  # ----------------------------------------------------------------------------
  zabbix-proxy:
    image: zabbix/zabbix-proxy-sqlite3:${ZABBIX_VERSION}
    container_name: zabbix-proxy
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging
    ports:
      # Trapper del proxy: qui gli agent ATTIVI della sede inviano i dati e il
      # server centrale interroga il proxy se lo si mette in modalita' passiva.
      # Esporla solo sulla LAN della sede, mai su Internet.
      - "${ZBX_LISTEN_ADDR}:10051:10051"
    environment:
      # --- Identificazione -----------------------------------------------------
      # ZBX_HOSTNAME deve combaciare ESATTAMENTE con il nome del proxy
      # configurato nel frontend (Administration -> Proxies).
      ZBX_HOSTNAME: ${ZBX_PROXY_HOSTNAME}
      ZBX_SERVER_HOST: ${ZBX_SERVER_HOST}
      ZBX_PROXYMODE: ${ZBX_PROXYMODE}

      # --- Timeout e sincronizzazione col server -------------------------------
      ZBX_TIMEOUT: ${ZBX_TIMEOUT}
      # Ogni quanti secondi il proxy riscarica la configurazione dal server.
      # NB: da Zabbix 7.0 il parametro e' ProxyConfigFrequency; il vecchio
      # ConfigFrequency (e HeartbeatFrequency) non esistono piu'.
      ZBX_PROXYCONFIGFREQUENCY: ${ZBX_PROXYCONFIGFREQUENCY}
      ZBX_DATASENDERFREQUENCY: ${ZBX_DATASENDERFREQUENCY}

      # --- Buffer dati (7.0+) --------------------------------------------------
      # ProxyBufferMode hybrid: i valori restano in RAM e vengono scritti su
      # SQLite solo quando serve (server irraggiungibile o buffer pieno).
      # Riduce moltissimo l'usura del disco rispetto a "disk".
      ZBX_PROXYBUFFERMODE: ${ZBX_PROXYBUFFERMODE}
      ZBX_PROXYMEMORYBUFFERSIZE: ${ZBX_PROXYMEMORYBUFFERSIZE}
      ZBX_PROXYMEMORYBUFFERAGE: ${ZBX_PROXYMEMORYBUFFERAGE}
      # Ore di dati conservati se il server centrale e' offline
      ZBX_PROXYOFFLINEBUFFER: ${ZBX_PROXYOFFLINEBUFFER}
      # Ore di dati mantenuti anche dopo l'invio (0 = cancella subito)
      ZBX_PROXYLOCALBUFFER: ${ZBX_PROXYLOCALBUFFER}

      # --- Cache ---------------------------------------------------------------
      ZBX_CACHESIZE: ${ZBX_CACHESIZE}
      ZBX_HISTORYCACHESIZE: ${ZBX_HISTORYCACHESIZE}
      ZBX_HISTORYINDEXCACHESIZE: ${ZBX_HISTORYINDEXCACHESIZE}
      ZBX_HOUSEKEEPINGFREQUENCY: ${ZBX_HOUSEKEEPINGFREQUENCY}

      # --- Pollers sincroni ----------------------------------------------------
      ZBX_STARTPOLLERS: ${ZBX_STARTPOLLERS}
      ZBX_STARTPOLLERSUNREACHABLE: ${ZBX_STARTPOLLERSUNREACHABLE}
      ZBX_STARTPINGERS: ${ZBX_STARTPINGERS}
      ZBX_STARTTRAPPERS: ${ZBX_STARTTRAPPERS}
      ZBX_STARTDISCOVERERS: ${ZBX_STARTDISCOVERERS}
      ZBX_STARTHTTPPOLLERS: ${ZBX_STARTHTTPPOLLERS}
      ZBX_STARTPREPROCESSORS: ${ZBX_STARTPREPROCESSORS}
      ZBX_STARTDBSYNCERS: ${ZBX_STARTDBSYNCERS}

      # --- Pollers asincroni (7.0+) --------------------------------------------
      # Gestiscono molti check concorrenti per processo: molto piu' efficienti
      # dei pollers classici per agent/SNMP/HTTP su sedi con tanti host.
      ZBX_STARTAGENTPOLLERS: ${ZBX_STARTAGENTPOLLERS}
      ZBX_STARTSNMPPOLLERS: ${ZBX_STARTSNMPPOLLERS}
      ZBX_STARTHTTPAGENTPOLLERS: ${ZBX_STARTHTTPAGENTPOLLERS}
      ZBX_MAXCONCURRENTCHECKSPERPOLLER: ${ZBX_MAXCONCURRENTCHECKSPERPOLLER}

      # --- SNMP traps ----------------------------------------------------------
      ZBX_ENABLE_SNMP_TRAPS: "true"
      ZBX_STARTSNMPTRAPPER: ${ZBX_STARTSNMPTRAPPER}

      # --- TLS verso il server centrale (PSK) ----------------------------------
      # Identity e valore devono combaciare ESATTAMENTE con quanto inserito nel
      # frontend sul proxy corrispondente.
      # ZBX_TLSPSK contiene la PSK in chiaro: l'entrypoint ufficiale la scrive
      # da solo in /var/lib/zabbix/enc_internal/ZBX_TLSPSKFILE con permessi 0600
      # e imposta ZBX_TLSPSKFILE di conseguenza. Non serve crearla a mano.
      ZBX_TLSCONNECT: psk
      ZBX_TLSACCEPT: psk
      ZBX_TLSPSKIDENTITY: ${ZBX_TLS_PSK_IDENTITY}
      ZBX_TLSPSK: ${ZBX_TLS_PSK_VALUE}

      TZ: ${TZ}
    volumes:
      # Database SQLite persistente. Volume nominato (non bind mount): cosi'
      # Docker eredita owner/permessi corretti dall'immagine (uid zabbix).
      - proxy_db:/var/lib/zabbix/db_data
      # MIB custom per Ubiquiti, stampanti, switch, ecc.
      - ./zabbix/mibs:/var/lib/zabbix/mibs:ro
      # External scripts per controlli custom
      - ./zabbix/externalscripts:/usr/lib/zabbix/externalscripts:ro
      # Trap SNMP condivise col container snmptraps
      - snmptraps:/var/lib/zabbix/snmptraps:ro
    networks:
      - zabbix-proxy-net
    # I discovery worker e i poller asincroni aprono un file descriptor per ogni
    # check concorrente. Col default di 1024 Zabbix riduce da solo
    # MaxConcurrentChecksPerPoller (avviso "user limit of 1024 file descriptors
    # is insufficient"). In alternativa si puo' abbassare
    # ZBX_MAXCONCURRENTCHECKSPERPOLLER nel .env.
    ulimits:
      nofile:
        soft: 16384
        hard: 16384
    sysctls:
      - net.ipv4.ip_local_port_range=1024 65000
      - net.ipv4.conf.all.accept_redirects=0
      - net.ipv4.conf.all.secure_redirects=0
      - net.ipv4.conf.all.send_redirects=0
    # Il vecchio check "nc -z 127.0.0.1 10051" apriva una connessione TCP al
    # trapper senza inviare nulla, e il proxy la registrava come
    # "trapper got non-JSON data" a ogni giro. Qui si guarda direttamente la
    # tabella dei socket del kernel: nessuna connessione, nessun rumore nei log.
    # 2743 = 10051 in esadecimale, 0A = stato LISTEN.
    healthcheck:
      test: ["CMD-SHELL", "cat /proc/net/tcp /proc/net/tcp6 2>/dev/null | grep -qE ':2743 0+:0000 0A'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ----------------------------------------------------------------------------
  # SNMP Traps receiver (trap da switch, stampanti, UPS della sede)
  # ----------------------------------------------------------------------------
  zabbix-snmptraps:
    image: zabbix/zabbix-snmptraps:${ZABBIX_VERSION}
    container_name: zabbix-snmptraps
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${ZBX_LISTEN_ADDR}:162:1162/udp"
    volumes:
      - snmptraps:/var/lib/zabbix/snmptraps:rw
    environment:
      TZ: ${TZ}
    networks:
      - zabbix-proxy-net

  # ----------------------------------------------------------------------------
  # Zabbix Agent 2 (automonitoring del proxy stesso)
  # ----------------------------------------------------------------------------
  zabbix-agent:
    image: zabbix/zabbix-agent2:${ZABBIX_VERSION}
    container_name: zabbix-agent
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - zabbix-proxy
    environment:
      # Deve combaciare con l'host creato nel frontend per questo proxy
      ZBX_HOSTNAME: ${ZBX_PROXY_HOSTNAME}
      # ZBX_SERVER_HOST viene messo dall'entrypoint SIA in Server= (check
      # passivi) SIA in ServerActive= (check attivi), quindi deve contenere solo
      # il proxy. Mettendoci anche 127.0.0.1 l'agent cercava un server sulla
      # propria loopback -> "connection refused" ogni pochi secondi.
      # NB: ZBX_SERVER_ACTIVE non esiste, la variabile giusta e' ZBX_ACTIVESERVERS.
      ZBX_SERVER_HOST: zabbix-proxy
      # Solo nella lista passiva: serve per un zabbix_get locale in debug.
      ZBX_PASSIVESERVERS: 127.0.0.1
      ZBX_PASSIVE_ALLOW: "true"
      TZ: ${TZ}
    networks:
      - zabbix-proxy-net
    privileged: true
    pid: host

# ==============================================================================
# Networks
# ==============================================================================
networks:
  zabbix-proxy-net:
    driver: bridge

# ==============================================================================
# Volumes
# ==============================================================================
volumes:
  proxy_db:
    driver: local
  snmptraps:
    driver: local
